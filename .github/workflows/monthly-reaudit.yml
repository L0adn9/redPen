# RedPen monthly re-audit: re-runs the AI red team on every assessment in the register, updates the Jira cards,
# emails an alert if exposure went up, and commits the results (data/reaudit/history.json) that the app shows.
# Repo secrets needed (Settings -> Secrets and variables -> Actions): OPENROUTER_API_KEY, JIRA_BASE_URL, JIRA_EMAIL,
# JIRA_API_TOKEN; optional SMTP_USER, SMTP_PASSWORD, REAUDIT_ALERT_EMAIL.
name: Monthly re-audit

on:
  schedule:
    - cron: "0 1 1 * *"   # 09:00 MYT on the 1st of every month
  workflow_dispatch:       # "Run workflow" button for a demo run

permissions:
  contents: write

concurrency:
  group: reaudit
  cancel-in-progress: false

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (the audit engine needs only jsonschema)
        run: pip install jsonschema
      - name: Re-audit every assessment in the register
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: RP
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REAUDIT_ALERT_EMAIL: ${{ secrets.REAUDIT_ALERT_EMAIL }}
        run: python tools/reaudit.py --trigger "${{ github.event_name }}"
      - name: Save the results to the repo
        if: always()
        run: |
          git config user.name "RedPen scheduler"
          git config user.email "redpen-scheduler@users.noreply.github.com"
          git add data/reaudit/history.json || true
          git diff --cached --quiet || git commit -m "Monthly re-audit $(date -u +%Y-%m-%d)"
          git push || true
